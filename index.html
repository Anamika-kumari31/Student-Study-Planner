<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Study Planner</h1>
        <p class="subtitle">Plan your study tasks and track your progress</p>

        <div class="form-box">
            <input type="text" id="taskInput" placeholder="Enter study task">

            <input type="text" id="subjectInput" placeholder="Enter subject">

            <input type="date" id="dateInput">

            <select id="priorityInput">
                <option value="">Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <button onclick="addTask()">Add Task</button>
        </div>
        <div class="filters">
    <input type="text" id="searchInput" placeholder="Search tasks...">

    <select id="statusFilter">
        <option value="all">All Tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
    </select>

    <select id="priorityFilter">
        <option value="all">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
    </select>
</div>

        <div class="stats">
            <div>
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div>
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

            <div>
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>
        </div>

        <div class="task-section">
            <h2>My Study Tasks</h2>
            <div id="taskList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
